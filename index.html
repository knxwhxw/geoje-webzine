<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함께거제 디지털 웹진</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans KR & Noto Serif KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Base typography defaults */
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        .font-serif-kr {
            font-family: 'Noto Serif KR', serif;
        }
        .font-sans-kr {
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* Custom Scrollbar for smooth reading */
        .custom-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Line height utility classes */
        .lh-tight { line-height: 1.4 !important; }
        .lh-normal { line-height: 1.7 !important; }
        .lh-relaxed { line-height: 2.0 !important; }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans h-screen w-screen overflow-hidden flex items-center justify-center select-none">

    <!-- App Container -->
    <div id="app" class="relative w-full max-w-md h-full sm:h-[95vh] bg-slate-50 sm:rounded-xl shadow-2xl flex flex-col overflow-hidden">

        <!-- Top Header Bar -->
        <header class="h-12 bg-white border-b border-slate-200 px-4 flex items-center justify-between z-20 flex-shrink-0">
            <!-- Left: Cover Button (표지로 가기) -->
            <button onclick="openArticle(0)" class="flex items-center gap-1 text-xs font-semibold text-slate-700 hover:text-emerald-600 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span>표지로 가기</span>
            </button>

            <!-- Center: 함께거제 (클릭 이벤트 없는 단순 텍스트) -->
            <span class="font-extrabold text-base text-slate-900 tracking-tight">함께거제</span>

            <!-- Right Controls: Settings & TOC Buttons -->
            <div class="flex items-center gap-2">
                <!-- Reading Settings Button (Aa) -->
                <button onclick="toggleSettingsModal(true)" class="p-1.5 rounded-md hover:bg-slate-100 text-slate-700 transition" title="글 읽기 설정">
                    <span class="font-bold text-xs tracking-tighter border border-slate-400 rounded px-1 py-0.5">Aa</span>
                </button>
                
                <!-- TOC Button -->
                <button onclick="toggleTocModal(true)" class="p-1.5 rounded-md hover:bg-slate-100 text-slate-700 transition" title="목차 보기">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
            </div>
        </header>

        <!-- Main Content Area: Grid Hub View -->
        <main id="hub-view" class="flex-1 overflow-y-auto custom-scroll p-4 space-y-4">
            
            <!-- Issue Banner -->
            <div class="bg-gradient-to-r from-emerald-600 to-teal-700 rounded-xl p-4 text-white shadow-sm flex items-center justify-between">
                <div>
                    <span class="text-[10px] uppercase tracking-wider font-semibold opacity-80">Vol. 2026.10</span>
                    <h2 class="text-lg font-extrabold mt-0.5">거제의 가을, 축제로 통하다</h2>
                </div>
                <span class="text-xs font-bold bg-white/20 px-2.5 py-1 rounded-full backdrop-blur-sm">8개 코너</span>
            </div>

            <!-- Thumbnail Grid Hub (ProSports style) -->
            <div class="grid grid-cols-2 gap-3" id="grid-container">
                <!-- Grid Cards populated dynamically via JavaScript -->
            </div>
        </main>

        <!-- Article Reader View (Drawer) -->
        <div id="article-view" class="absolute inset-0 bg-white z-30 transform translate-y-full transition-transform duration-300 ease-in-out flex flex-col">
            <!-- Article Header Nav -->
            <div class="h-12 bg-white border-b border-slate-200 px-4 flex items-center justify-between flex-shrink-0">
                <button onclick="closeArticle()" class="flex items-center gap-1 text-xs font-semibold text-slate-600 hover:text-slate-900">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    <span>목차 허브로</span>
                </button>
                <span id="article-category-badge" class="text-[11px] font-bold text-emerald-600 bg-emerald-50 px-2.5 py-0.5 rounded-full">카테고리</span>
                <button onclick="toggleSettingsModal(true)" class="p-1.5 text-slate-700 hover:bg-slate-100 rounded">
                    <span class="font-bold text-xs border border-slate-400 rounded px-1 py-0.5">Aa</span>
                </button>
            </div>

            <!-- Article Body Content (Scrollable & Dynamic Styles) -->
            <div id="article-content-wrapper" class="flex-1 overflow-y-auto custom-scroll p-5 space-y-5">
                <div id="article-header">
                    <span id="article-sub" class="text-xs font-bold text-emerald-600 uppercase tracking-wide">SUBTITLE</span>
                    <h1 id="article-title" class="text-2xl font-extrabold text-slate-900 leading-snug mt-1">TITLE</h1>
                </div>

                <div id="article-hero-img" class="w-full h-48 bg-slate-200 rounded-lg overflow-hidden flex items-center justify-center text-slate-400 text-xs">
                    [ 대표 이미지 영역 ]
                </div>

                <!-- Dynamic Reading Content Container -->
                <div id="article-body" class="readable-body text-slate-700 space-y-4 text-base font-normal lh-normal font-sans-kr">
                    <!-- Article HTML injected dynamically -->
                </div>
            </div>

            <!-- Article Footer Navigation (이전기사 / 다음기사) -->
            <div class="h-12 bg-slate-50 border-t border-slate-200 px-4 flex items-center justify-between text-xs font-medium text-slate-700 flex-shrink-0">
                <button id="prev-art-btn" onclick="navArticle(-1)" class="flex items-center gap-1 hover:text-emerald-600 disabled:opacity-30 disabled:cursor-not-allowed">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    <span>이전 글</span>
                </button>
                <span id="article-step-txt" class="text-slate-400 font-bold">1 / 8</span>
                <button id="next-art-btn" onclick="navArticle(1)" class="flex items-center gap-1 hover:text-emerald-600 disabled:opacity-30 disabled:cursor-not-allowed">
                    <span>다음 글</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                </button>
            </div>
        </div>

        <!-- Table of Contents Modal -->
        <div id="toc-modal" class="absolute inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm max-h-[80vh] flex flex-col overflow-hidden">
                <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                    <h3 class="font-bold text-slate-900 text-base">전체 목차</h3>
                    <button onclick="toggleTocModal(false)" class="text-slate-400 hover:text-slate-600 p-1 font-bold">✕</button>
                </div>
                <div class="p-3 overflow-y-auto space-y-1.5 text-sm" id="toc-list">
                    <!-- TOC Buttons populated dynamically -->
                </div>
            </div>
        </div>

        <!-- Reading Environment Settings Modal (글 읽기 환경 설정) -->
        <div id="settings-modal" class="absolute inset-0 bg-slate-950/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
            <div class="bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl w-full max-w-sm p-5 space-y-5 animate-slide-up">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <h3 class="font-bold text-slate-900 text-base flex items-center gap-1.5">
                        <span class="text-emerald-600">Aa</span> 글 읽기 환경 설정
                    </h3>
                    <button onclick="toggleSettingsModal(false)" class="text-slate-400 hover:text-slate-600 font-bold p-1">✕</button>
                </div>

                <!-- 1. Font Style Selection -->
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block">서체 (Font)</label>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <button onclick="setReaderFont('font-sans-kr')" id="font-btn-sans" class="p-2.5 rounded-lg border border-emerald-500 bg-emerald-50 text-emerald-800 font-bold text-center">본문 고딕체</button>
                        <button onclick="setReaderFont('font-serif-kr')" id="font-btn-serif" class="p-2.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-700 font-serif-kr text-center">감성 명조체</button>
                    </div>
                </div>

                <!-- 2. Font Size Selection -->
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block">글자 크기 (Size)</label>
                    <div class="grid grid-cols-4 gap-1.5 text-xs">
                        <button onclick="setReaderSize('text-sm')" id="size-btn-sm" class="p-2 rounded border border-slate-200 text-slate-700">작게</button>
                        <button onclick="setReaderSize('text-base')" id="size-btn-base" class="p-2 rounded border border-emerald-500 bg-emerald-50 text-emerald-800 font-bold">보통</button>
                        <button onclick="setReaderSize('text-lg')" id="size-btn-lg" class="p-2 rounded border border-slate-200 text-slate-700">크게</button>
                        <button onclick="setReaderSize('text-xl')" id="size-btn-xl" class="p-2 rounded border border-slate-200 text-slate-700">매우크게</button>
                    </div>
                </div>

                <!-- 3. Line Height Selection -->
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block">줄 간격 (Line Height)</label>
                    <div class="grid grid-cols-3 gap-2 text-xs">
                        <button onclick="setReaderLH('lh-tight')" id="lh-btn-tight" class="p-2 rounded border border-slate-200 text-slate-700">좁게</button>
                        <button onclick="setReaderLH('lh-normal')" id="lh-btn-normal" class="p-2 rounded border border-emerald-500 bg-emerald-50 text-emerald-800 font-bold">보통</button>
                        <button onclick="setReaderLH('lh-relaxed')" id="lh-btn-relaxed" class="p-2 rounded border border-slate-200 text-slate-700">넓게</button>
                    </div>
                </div>

                <button onclick="toggleSettingsModal(false)" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl transition shadow-md">
                    적용 완료
                </button>
            </div>
        </div>

    </div>

    <!-- Data & Script Logic -->
