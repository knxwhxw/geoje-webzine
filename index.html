<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>거제시정소식지 함께거제</title>
    
    <!-- 검색엔진이 이 페이지를 수집하지 못하도록 차단 -->
    <meta name="robots" content="noindex, nofollow">

    <!-- Tailwind CSS -->

    <!-- Google Fonts: Noto Sans KR & Noto Serif KR -->

    <!-- 구글 애널리틱스(GA4) 추적 코드 -->

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
            overscroll-behavior: none;
            touch-action: none;
            overflow: hidden;
        }
        .font-noto-sans, .font-noto-sans * { font-family: 'Noto Sans KR', sans-serif !important; }
        .font-noto-serif, .font-noto-serif * { font-family: 'Noto Serif KR', serif !important; }
        
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        
        .card-hover-effect { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .card-hover-effect:active { transition: transform 0.2s ease, box-shadow 0.2s ease; transform: scale(0.98); }
        
        .lh-tight, .lh-tight * { line-height: 1.4 !important; }
        .lh-normal, .lh-normal * { line-height: 1.75 !important; }
        .lh-relaxed, .lh-relaxed * { line-height: 2.1 !important; }

        .text-sm-force, .text-sm-force p, .text-sm-force div, .text-sm-force span, .text-sm-force li { font-size: 0.875rem !important; }
        .text-base-force, .text-base-force p, .text-base-force div, .text-base-force span, .text-base-force li { font-size: 1rem !important; }
        .text-lg-force, .text-lg-force p, .text-lg-force div, .text-lg-force span, .text-lg-force li { font-size: 1.125rem !important; }
        .text-xl-force, .text-xl-force p, .text-xl-force div, .text-xl-force span, .text-xl-force li { font-size: 1.25rem !important; }

        .scrollable-area {
            overscroll-behavior-y: contain;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }

        .no-drag-bar {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .app-container { height: 100%; height: 100dvh; }
    </style>
</head>
<body class="text-slate-800 flex items-center justify-center">

    <div id="app" class="relative w-full max-w-5xl app-container bg-slate-50 md:h-[95vh] md:rounded-2xl shadow-2xl flex flex-col overflow-hidden">

        <!-- Top Navigation Header -->
        <header class="h-14 bg-white/95 backdrop-blur border-b border-slate-200 px-4 flex items-center justify-between text-xs sm:text-sm font-medium z-30 flex-shrink-0 shadow-sm relative no-drag-bar">
            <div class="flex items-center">
                <button id="btn-open-settings" class="flex items-center justify-center w-9 h-9 rounded-lg hover:bg-slate-100 active:bg-slate-200 text-slate-700 transition cursor-pointer border border-slate-300">
                    <span class="font-extrabold text-sm tracking-tight text-emerald-600">Aa</span>
                </button>
            </div>

            <!-- 상단 함께거제 클릭 시 메인페이지 이동 및 스크롤 최상단 이동 -->
            <div onclick="showHubView()" class="absolute left-1/2 -translate-x-1/2 font-black text-slate-900 text-base sm:text-lg tracking-tight cursor-pointer hover:text-emerald-700 active:opacity-70 transition p-2 select-none">
                <span>함께거제</span>
            </div>

            <div class="flex items-center">
                <button id="btn-open-toc" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg hover:bg-slate-100 active:bg-slate-200 text-slate-700 transition cursor-pointer">
                    <span class="hidden sm:inline font-bold">전체 목차</span>
                    <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
            </div>
        </header>

        <!-- Main Body Area -->
        <main class="flex-1 relative overflow-hidden bg-slate-100 h-full">

            <!-- 1. HUB INDEX VIEW -->
            <div id="hub-view" class="h-full overflow-y-auto custom-scroll scrollable-area p-4 sm:p-8 space-y-8 font-noto-sans text-base-force lh-normal">
                
                <!-- 메인 타이틀 배너 영역 (4:5 비율 / 표지 내부 상단우측 로고 & 하단좌측 글래스 뱃지) -->
                <div class="relative w-full aspect-[4/5] rounded-2xl text-white shadow-lg overflow-hidden group bg-cover bg-center" style="background-image: url('./2609_c.webp');">
                    <!-- 그라데이션 오버레이 -->
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/70 via-transparent to-slate-900/30 pointer-events-none"></div>

                    <!-- 1. 표지 박스 내부 상단 우측 로고 -->
                    <div class="absolute top-5 right-5 sm:top-7 sm:right-7 z-10">
                        <img src="./logo.svg" alt="함께거제 로고" class="w-28 sm:w-44 h-auto object-contain drop-shadow-lg">
                    </div>

                    <!-- 2. 표지 박스 내부 하단 좌측 글래스모피즘 VOL 뱃지 -->
                    <div class="absolute bottom-5 left-5 sm:bottom-7 sm:left-7 z-10">
                        <div class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-white/20 backdrop-blur-md text-white text-xs sm:text-sm font-bold rounded-xl border border-white/30 shadow-lg">
                            <span>VOL. 142</span>
                            <span>•</span>
                            <span>2026 OCTOBER</span>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                    <h2 class="text-lg sm:text-xl font-extrabold text-slate-900 flex items-center gap-2">
                        <span class="w-2.5 h-6 bg-emerald-600 rounded-full"></span>
                        10월호 목차 & 콘텐츠
                    </h2>
                    <span id="total-articles-count" class="text-xs font-semibold text-slate-500">총 10개 코너</span>
                </div>

                <!-- Grid Thumbnails -->
                <div id="articles-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 pb-8">
                    <!-- 자바스크립트로 동적 생성됩니다 -->
                </div>

                <!-- 메인페이지 최하단 푸터 영역 -->
                <footer class="pt-6 pb-10 border-t border-slate-200 text-center">
                    <p class="text-xs font-bold text-slate-400">거제시정소식지 함께거제 2026년 10월호</p>
                </footer>
            </div>

            <!-- 2. ARTICLE READER VIEW -->
            <div id="article-view" class="hidden absolute inset-0 bg-white z-20 flex flex-col h-full w-full overflow-hidden">
                <div class="px-4 sm:px-8 py-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between flex-shrink-0 z-10 no-drag-bar">
                    <button onclick="showHubView()" class="inline-flex items-center gap-1.5 text-xs sm:text-sm font-bold text-slate-700 hover:text-emerald-600 active:text-emerald-700 transition cursor-pointer py-1 px-2 -ml-2 rounded-lg">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                        <span>목차로 돌아가기</span>
                    </button>
                    <span id="article-category-badge" class="px-2.5 py-0.5 bg-emerald-100 text-emerald-800 rounded-full text-[11px] font-extrabold">CATEGORY</span>
                </div>

                <div id="article-content-scroll" class="flex-1 overflow-y-auto custom-scroll scrollable-area p-5 sm:p-10 max-w-3xl mx-auto w-full">
                    <div id="article-body-container" class="space-y-6 font-noto-sans text-base-force lh-normal pb-12"></div>
                </div>

                <div class="h-16 bg-white border-t border-slate-200 px-6 sm:px-10 flex items-center justify-between flex-shrink-0 text-xs sm:text-sm z-30 shadow-[0_-4px_10px_rgba(0,0,0,0.05)] no-drag-bar">
                    <button id="prev-art-btn" onclick="navArticle(-1)" class="flex items-center gap-2 font-bold text-slate-700 hover:text-emerald-600 active:text-emerald-700 transition disabled:opacity-30 cursor-pointer py-2 px-3 bg-slate-100 rounded-lg">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                        <span>이전 코너</span>
                    </button>
                    <span id="article-progress-txt" class="font-extrabold text-slate-500 text-xs tracking-wider">1 / 10</span>
                    <button id="next-art-btn" onclick="navArticle(1)" class="flex items-center gap-2 font-bold text-slate-700 hover:text-emerald-600 active:text-emerald-700 transition disabled:opacity-30 cursor-pointer py-2 px-3 bg-slate-100 rounded-lg">
                        <span>다음 코너</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                    </button>
                </div>
            </div>
        </main>

        <!-- Table of Contents Modal -->
        <div id="toc-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4 no-drag-bar">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md max-h-[85vh] flex flex-col overflow-hidden border border-slate-200">
                <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                    <h3 class="font-extrabold text-slate-800 text-base">전체 목차</h3>
                    <button onclick="toggleTocModal(false)" class="text-slate-400 hover:text-slate-600 p-2 cursor-pointer font-bold">✕</button>
                </div>
                <div id="toc-list-container" class="p-4 overflow-y-auto space-y-2 text-sm custom-scroll scrollable-area"></div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4 no-drag-bar">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 space-y-5 border border-slate-200">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <h3 class="font-bold text-slate-900 text-base flex items-center gap-1.5"><span class="text-emerald-600 font-extrabold">Aa</span>독서환경설정</h3>
                    <button onclick="toggleSettingsModal(false)" class="text-slate-400 hover:text-slate-600 font-bold p-2 cursor-pointer">✕</button>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block">글꼴</label>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <button onclick="setReaderFont('font-noto-sans')" id="font-btn-sans" class="p-2.5 rounded-lg border border-emerald-500 bg-emerald-50 text-emerald-800 font-bold text-center cursor-pointer">고딕</button>
                        <button onclick="setReaderFont('font-noto-serif')" id="font-btn-serif" class="p-2.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-700 font-noto-serif text-center cursor-pointer">명조</button>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block">크기</label>
                    <div class="grid grid-cols-4 gap-1.5 text-xs">
                        <button onclick="setReaderSize('text-sm-force')" id="size-btn-sm" class="p-2 rounded-lg border border-slate-200 text-slate-700 cursor-pointer">작게</button>
                        <button onclick="setReaderSize('text-base-force')" id="size-btn-base" class="p-2 rounded-lg border border-emerald-500 bg-emerald-50 text-emerald-800 font-bold cursor-pointer">보통</button>
                        <button onclick="setReaderSize('text-lg-force')" id="size-btn-lg" class="p-2 rounded-lg border border-slate-200 text-slate-700 cursor-pointer">크게</button>
                        <button onclick="setReaderSize('text-xl-force')" id="size-btn-xl" class="p-2 rounded-lg border border-slate-200 text-slate-700 cursor-pointer">매우크게</button>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block">글간격</label>
                    <div class="grid grid-cols-3 gap-2 text-xs">
                        <button onclick="setReaderLH('lh-tight')" id="lh-btn-tight" class="p-2 rounded-lg border border-slate-200 text-slate-700 cursor-pointer">좁게</button>
                        <button onclick="setReaderLH('lh-normal')" id="lh-btn-normal" class="p-2 rounded-lg border border-emerald-500 bg-emerald-50 text-emerald-800 font-bold cursor-pointer">보통</button>
                        <button onclick="setReaderLH('lh-relaxed')" id="lh-btn-relaxed" class="p-2 rounded-lg border border-slate-200 text-slate-700 cursor-pointer">넓게</button>
                    </div>
                </div>

                <button onclick="toggleSettingsModal(false)" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl transition shadow-md cursor-pointer">확인</button>
            </div>
        </div>

        <!-- 이미지 라이트박스 팝업 모달 -->
        <div id="image-modal" class="fixed inset-0 bg-black/95 z-50 hidden items-center justify-center p-0 overflow-hidden" onclick="closeImageModal()">
            <button onclick="closeImageModal()" class="absolute top-5 right-5 text-white text-3xl font-bold hover:text-slate-300 cursor-pointer p-3 z-50 bg-black/40 rounded-full w-12 h-12 flex items-center justify-center">✕</button>
            
            <div class="relative w-full h-full flex items-center justify-center overflow-hidden p-4">
                <img id="modal-image-view" src="" alt="확대 이미지" 
                     class="max-w-full max-h-full object-contain cursor-grab active:cursor-grabbing select-none"
                     style="transform: translate(0px, 0px) scale(1); touch-action: none;"
                     draggable="false"
                     onclick="event.stopPropagation()">
            </div>
        </div>

    </div>

    <!-- 외부 기사 데이터 파일들 -->
    <script src="./data1.js"></script>
    <script src="./data2.js"></script>
    <script src="./data3.js"></script>
    <script src="./data4.js"></script>
    <script src="./data5.js"></script>
    <script src="./data6.js"></script>
    <script src="./data7.js"></script>
    <script src="./data8.js"></script>
    <script src="./data9.js"></script>
    <script src="./data10.js"></script>

    <!-- 뷰어 작동 로직 스크립트 -->
    <script>
        var articles = [];
        var currentArticleIndex = 0;
        var currentFont = 'font-noto-sans';
        var currentSize = 'text-base-force';
        var currentLH = 'lh-normal';

        // 핀치 줌 및 패닝(드래그) 상태 변수
        var scale = 1;
        var panX = 0;
        var panY = 0;
        var startX = 0;
        var startY = 0;
        var isDragging = false;
        var initialDistance = null;
        var initialScale = 1;

        function initArticles() {
            articles = [
                typeof article1 !== 'undefined' ? article1 : null,
                typeof article2 !== 'undefined' ? article2 : null,
                typeof article3 !== 'undefined' ? article3 : null,
                typeof article4 !== 'undefined' ? article4 : null,
                typeof article5 !== 'undefined' ? article5 : null,
                typeof article6 !== 'undefined' ? article6 : null,
                typeof article7 !== 'undefined' ? article7 : null,
                typeof article8 !== 'undefined' ? article8 : null,
                typeof article9 !== 'undefined' ? article9 : null,
                typeof article10 !== 'undefined' ? article10 : null
            ].filter(Boolean);

            var countEl = document.getElementById('total-articles-count');
            if (countEl) {
                countEl.innerText = '총 ' + articles.length + '개 코너';
            }
        }

        function renderArticlesGrid() {
            var gridContainer = document.getElementById('articles-grid');
            if (!gridContainer) return;

            var htmlContent = '';
            articles.forEach(function(art, index) {
                htmlContent += `
                    <article onclick="openArticle(${index})" class="card-hover-effect bg-white rounded-2xl overflow-hidden border border-slate-200 shadow-sm cursor-pointer flex flex-col group">
                        <div class="relative h-44 w-full overflow-hidden">
                            <img src="${art.thumbnail || './images/a1_1.webp'}" alt="${art.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                            <span class="absolute top-3 left-3 z-10 bg-black/50 text-emerald-300 backdrop-blur-md px-2.5 py-1 rounded-md text-[11px] font-bold tracking-wider">
                                ${art.category}
                            </span>
                        </div>
                        <div class="p-5 flex-1 flex flex-col justify-between space-y-2 bg-white">
                            <h3 class="font-bold text-slate-900 text-base leading-snug group-hover:text-emerald-700 transition">
                                ${art.title}
                            </h3>
                            <p class="text-xs text-slate-500 leading-relaxed line-clamp-2">
                                ${art.summary || art.subtitle}
                            </p>
                        </div>
                    </article>
                `;
            });
            gridContainer.innerHTML = htmlContent;
        }

        function renderTocModalList() {
            var tocContainer = document.getElementById('toc-list-container');
            if (!tocContainer) return;

            var htmlContent = `
                <button onclick="showHubView(); toggleTocModal(false);" class="w-full text-left p-3 rounded-xl hover:bg-emerald-50 active:bg-emerald-100 transition flex justify-between items-center group bg-slate-50 mb-2 cursor-pointer">
                    <span class="font-bold text-emerald-700">🏠 메인 목차 홈으로</span>
                </button>
            `;
            articles.forEach(function(art, index) {
                var numStr = index < 10 ? '0' + index : index;
                htmlContent += `
                    <button onclick="openArticle(${index}); toggleTocModal(false);" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 active:bg-slate-200 transition flex justify-between items-center group cursor-pointer">
                        <span class="font-bold text-slate-800 group-hover:text-emerald-700">${numStr}. ${art.category}: ${art.title}</span>
                    </button>
                `;
            });
            tocContainer.innerHTML = htmlContent;
        }

        // 메인 페이지로 이동하면서 스크롤을 맨 위로 올리는 함수
        function showHubView() {
            document.getElementById('hub-view').classList.remove('hidden');
            document.getElementById('article-view').classList.add('hidden');
            var hubScroll = document.getElementById('hub-view');
            if (hubScroll) {
                hubScroll.scrollTop = 0;
            }
        }

        function openArticle(index) {
            if (index < 0 || index >= articles.length) return;
            currentArticleIndex = index;
            var data = articles[index];

            document.getElementById('article-category-badge').innerText = data.category;
            document.getElementById('article-progress-txt').innerText = (currentArticleIndex + 1) + ' / ' + articles.length;

            document.getElementById('article-body-container').innerHTML = 
                '<div class="w-full rounded-2xl bg-gradient-to-br ' + data.headerGradient + ' text-white p-6 sm:p-8 shadow-md relative overflow-hidden mb-6">' +
                    '<span class="text-4xl block mb-2">' + data.icon + '</span>' +
                    '<span class="text-xs font-bold uppercase tracking-wider text-white/80">' + data.category + '</span>' +
                    '<h1 class="text-2xl sm:text-3xl font-black text-white mt-1 leading-tight">' + data.title + '</h1>' +
                    '<p class="text-xs sm:text-sm text-white/90 font-light mt-2">' + data.subtitle + '</p>' +
                '</div>' +
                '<div class="reader-content">' + data.content + '</div>';

            applyReaderStyles();

            document.getElementById('prev-art-btn').disabled = (currentArticleIndex === 0);
            document.getElementById('next-art-btn').disabled = (currentArticleIndex === articles.length - 1);

            document.getElementById('hub-view').classList.add('hidden');
            document.getElementById('article-view').classList.remove('hidden');
            document.getElementById('article-content-scroll').scrollTop = 0;
        }

        function navArticle(direction) {
            var nextIndex = currentArticleIndex + direction;
            if (nextIndex >= 0 && nextIndex < articles.length) {
                openArticle(nextIndex);
            }
        }

        function toggleTocModal(show) {
            var modal = document.getElementById('toc-modal');
            if (modal) modal.classList.toggle('hidden', !show);
            if (modal) modal.classList.toggle('flex', show);
        }

        function toggleSettingsModal(show) {
            var modal = document.getElementById('settings-modal');
            if (modal) modal.classList.toggle('hidden', !show);
            if (modal) modal.classList.toggle('flex', show);
        }

        function applyReaderStyles() {
            var articleBodyContainer = document.getElementById('article-body-container');
            var hubView = document.getElementById('hub-view');
            var targets = [articleBodyContainer, hubView];

            var fontClasses = ['font-noto-sans', 'font-noto-serif'];
            var sizeClasses = ['text-sm-force', 'text-base-force', 'text-lg-force', 'text-xl-force'];
            var lhClasses = ['lh-tight', 'lh-normal', 'lh-relaxed'];

            targets.forEach(function(el) {
                if (!el) return;
                fontClasses.concat(sizeClasses, lhClasses).forEach(function(cls) {
                    el.classList.remove(cls);
                });
                el.classList.add(currentFont, currentSize, currentLH);
            });
        }

        function setReaderFont(fontClass) {
            currentFont = fontClass;
            applyReaderStyles();
            document.getElementById('font-btn-sans').className = fontClass === 'font-noto-sans' ? 'p-2.5 rounded-lg border border-emerald-500 bg-emerald-50 text-emerald-800 font-bold text-center cursor-pointer' : 'p-2.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-700 text-center cursor-pointer';
            document.getElementById('font-btn-serif').className = fontClass === 'font-noto-serif' ? 'p-2.5 rounded-lg border border-emerald-500 bg-emerald-50 text-emerald-800 font-bold font-noto-serif text-center cursor-pointer' : 'p-2.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-700 text-center cursor-pointer';
        }

        function setReaderSize(sizeClass) {
            currentSize = sizeClass;
            applyReaderStyles();
            ['sm', 'base', 'lg', 'xl'].forEach(function(s) {
                var btn = document.getElementById('size-btn-' + s);
                if (btn) {
                    var isMatch = (sizeClass === 'text-' + s + '-force');
                    btn.className = isMatch ? 'p-2 rounded-lg border border-emerald-500 bg-emerald-50 text-emerald-800 font-bold cursor-pointer' : 'p-2 rounded-lg border border-slate-200 text-slate-700 cursor-pointer';
                }
            });
        }

        function setReaderLH(lhClass) {
            currentLH = lhClass;
            applyReaderStyles();
            ['tight', 'normal', 'relaxed'].forEach(function(l) {
                var btn = document.getElementById('lh-btn-' + l);
                if (btn) {
                    var isMatch = (lhClass === 'lh-' + l);
                    btn.className = isMatch ? 'p-2 rounded-lg border border-emerald-500 bg-emerald-50 text-emerald-800 font-bold cursor-pointer' : 'p-2 rounded-lg border border-slate-200 text-slate-700 cursor-pointer';
                }
            });
        }

        // 이미지 라이트박스 열기 및 위치 초기화
        function openImageModal(imgSrc) {
            var modal = document.getElementById('image-modal');
            var modalImg = document.getElementById('modal-image-view');
            if (modal && modalImg) {
                modalImg.src = imgSrc;
                scale = 1;
                panX = 0;
                panY = 0;
                updateTransform(modalImg);
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }

        // 검은 바탕 클릭 시 모달 닫기
        function closeImageModal() {
            var modal = document.getElementById('image-modal');
            if (modal) {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }
        }

        function updateTransform(img) {
            img.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function getDistance(touches) {
            return Math.hypot(
                touches[0].clientX - touches[1].clientX,
                touches[0].clientY - touches[1].clientY
            );
        }

        document.addEventListener('DOMContentLoaded', function() {
            var btnSettings = document.getElementById('btn-open-settings');
            var btnToc = document.getElementById('btn-open-toc');

            if (btnSettings) btnSettings.addEventListener('click', function(e) { e.stopPropagation(); toggleSettingsModal(true); });
            if (btnToc) btnToc.addEventListener('click', function(e) { e.stopPropagation(); toggleTocModal(true); });

            initArticles();
            renderArticlesGrid();
            renderTocModalList();

            // 핀치 줌 및 패닝(드래그) 이벤트 리스너 설정
            var modalImg = document.getElementById('modal-image-view');
            if (modalImg) {
                modalImg.addEventListener('mousedown', function(e) {
                    isDragging = true;
                    startX = e.clientX - panX;
                    startY = e.clientY - panY;
                    e.stopPropagation();
                    e.preventDefault();
                });

                window.addEventListener('mousemove', function(e) {
                    if (!isDragging) return;
                    panX = e.clientX - startX;
                    panY = e.clientY - startY;
                    updateTransform(modalImg);
                });

                window.addEventListener('mouseup', function() {
                    isDragging = false;
                });

                modalImg.addEventListener('wheel', function(e) {
                    e.preventDefault();
                    var zoomIntensity = 0.15;
                    if (e.deltaY < 0) {
                        scale = Math.min(scale * (1 + zoomIntensity), 5);
                    } else {
                        scale = Math.max(scale * (1 - zoomIntensity), 1);
                        if (scale === 1) { panX = 0; panY = 0; }
                    }
                    updateTransform(modalImg);
                }, { passive: false });

                modalImg.addEventListener('touchstart', function(e) {
                    e.stopPropagation();
                    if (e.touches.length === 1) {
                        isDragging = true;
                        startX = e.touches[0].clientX - panX;
                        startY = e.touches[0].clientY - panY;
                    } else if (e.touches.length === 2) {
                        isDragging = false;
                        initialDistance = getDistance(e.touches);
                        initialScale = scale;
                    }
                }, { passive: true });

                modalImg.addEventListener('touchmove', function(e) {
                    if (e.touches.length === 1 && isDragging) {
                        panX = e.touches[0].clientX - startX;
                        panY = e.touches[0].clientY - startY;
                        updateTransform(modalImg);
                    } else if (e.touches.length === 2 && initialDistance !== null) {
                        var currentDistance = getDistance(e.touches);
                        var zoomFactor = currentDistance / initialDistance;
                        scale = Math.min(Math.max(initialScale * zoomFactor, 1), 5);
                        if (scale === 1) { panX = 0; panY = 0; }
                        updateTransform(modalImg);
                    }
                }, { passive: true });

                modalImg.addEventListener('touchend', function(e) {
                    if (e.touches.length < 2) {
                        initialDistance = null;
                    }
                    if (e.touches.length === 0) {
                        isDragging = false;
                    }
                });
            }

            document.body.addEventListener('touchmove', function(e) {
                if (!e.target.closest('.scrollable-area') && !e.target.closest('#image-modal')) {
                    e.preventDefault();
                }
            }, { passive: false });
        });
    </script>
</body>
</html>
